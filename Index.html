<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1769aa">
  <link rel="manifest" href="manifest.json">
  <title>Genset Log</title>

  <style>
    :root {
      --blue: #1769aa;
      --light: #f3f6f9;
      --border: #d9e0e6;
      --danger: #b42318;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--light);
      color: #17212b;
    }

    header {
      background: var(--blue);
      color: white;
      padding: calc(16px + env(safe-area-inset-top)) 18px 16px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    main {
      max-width: 760px;
      margin: auto;
      padding: 16px;
    }

    section, .entry {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px #00000012;
    }

    h2 {
      font-size: 19px;
      margin: 0 0 14px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-top: 12px;
      font-size: 14px;
    }

    input, select, textarea, button {
      width: 100%;
      font: inherit;
      border-radius: 8px;
      padding: 11px;
      margin-top: 5px;
    }

    input, select, textarea {
      border: 1px solid var(--border);
      background: white;
    }

    textarea {
      min-height: 65px;
      resize: vertical;
    }

    button {
      border: 0;
      background: var(--blue);
      color: white;
      font-weight: 700;
      margin-top: 16px;
    }

    button.secondary {
      background: #e7eef5;
      color: #17212b;
    }

    button.danger {
      background: #fff0ef;
      color: var(--danger);
      margin-top: 10px;
    }

    .calculated {
      background: #eaf4ff;
      border-radius: 8px;
      padding: 13px;
      margin-top: 14px;
      font-size: 17px;
      font-weight: 700;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .summary-card {
      background: #f5f8fb;
      border-radius: 8px;
      padding: 12px;
    }

    .summary-card small {
      display: block;
      color: #52606d;
      margin-bottom: 5px;
    }

    .summary-card strong {
      font-size: 18px;
    }

    .date-heading {
      font-size: 17px;
      font-weight: 700;
      margin: 22px 0 8px;
    }

    .entry {
      margin-bottom: 9px;
      border-left: 4px solid var(--blue);
    }

    .entry-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-weight: 700;
    }

    .entry-details {
      color: #52606d;
      font-size: 14px;
      line-height: 1.6;
      margin-top: 7px;
    }

    .muted {
      color: #667784;
      text-align: center;
      padding: 10px;
    }

    .button-row {
      display: flex;
      gap: 8px;
    }

    .button-row button {
      flex: 1;
    }

    @media (min-width: 600px) {
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 14px;
      }

      .form-grid label {
        margin-top: 12px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Genset Log</h1>
  </header>

  <main>
    <section>
      <h2 id="formTitle">Add operating record</h2>

      <form id="logForm">
        <input type="hidden" id="entryId">

        <div class="form-grid">
          <div>
            <label for="date">Date</label>
            <input id="date" type="date" required>
          </div>

          <div>
            <label for="genset">Genset</label>
            <select id="genset" required>
              <option value="Gentrax">Gentrax</option>
              <option value="Kubota">Kubota</option>
            </select>
          </div>

          <div>
            <label for="hours">Operating hours</label>
            <input id="hours" type="number" min="0" step="0.1" placeholder="e.g. 5.5" required>
          </div>

          <div>
            <label for="litres">Fuel used, litres</label>
            <input id="litres" type="number" min="0" step="0.01" placeholder="e.g. 8.2" required>
          </div>

          <div>
            <label for="price">Fuel price per litre</label>
            <input id="price" type="number" min="0" step="0.001" placeholder="e.g. 2.00" required>
          </div>
        </div>

        <label for="notes">Notes — optional</label>
        <textarea id="notes" placeholder="e.g. Morning run, pump operation"></textarea>

        <div class="calculated">
          Calculated fuel cost: <span id="calculatedCost">$0.00</span>
        </div>

        <div class="button-row">
          <button type="submit" id="saveButton">Save record</button>
          <button type="button" class="secondary" id="cancelButton" hidden>Cancel</button>
        </div>
      </form>
    </section>

    <section>
      <h2>Summary</h2>
      <div class="summary-grid">
        <div class="summary-card">
          <small>Total operating hours</small>
          <strong id="totalHours">0.0</strong>
        </div>
        <div class="summary-card">
          <small>Total fuel used</small>
          <strong id="totalLitres">0.00 L</strong>
        </div>
        <div class="summary-card">
          <small>Total fuel cost</small>
          <strong id="totalCost">$0.00</strong>
        </div>
        <div class="summary-card">
          <small>Cost per operating hour</small>
          <strong id="costPerHour">$0.00</strong>
        </div>
      </div>

      <button class="secondary" id="exportButton">Export CSV</button>
    </section>

    <section>
      <h2>Operating records</h2>
      <div id="records"></div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "genset-log-records-v1";
    const CURRENCY = "AUD";

    const $ = id => document.getElementById(id);
    let records = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

    function money(value) {
      return new Intl.NumberFormat("en-AU", {
        style: "currency",
        currency: CURRENCY
      }).format(Number(value) || 0);
    }

    function today() {
      const d = new Date();
      return d.toISOString().slice(0, 10);
    }

    function saveRecords() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }

    function updateCost() {
      const litres = Number($("litres").value) || 0;
      const price = Number($("price").value) || 0;
      $("calculatedCost").textContent = money(litres * price);
    }

    function formatDate(dateString) {
      const d = new Date(dateString + "T00:00:00");
      return d.toLocaleDateString("en-AU", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      });
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderSummary() {
      const hours = records.reduce((sum, r) => sum + Number(r.hours), 0);
      const litres = records.reduce((sum, r) => sum + Number(r.litres), 0);
      const cost = records.reduce((sum, r) => sum + Number(r.cost), 0);

      $("totalHours").textContent = hours.toFixed(1);
      $("totalLitres").textContent = litres.toFixed(2) + " L";
      $("totalCost").textContent = money(cost);
      $("costPerHour").textContent = money(hours ? cost / hours : 0);
    }

    function renderRecords() {
      const container = $("records");

      if (!records.length) {
        container.innerHTML = '<div class="muted">No records saved yet.</div>';
        return;
      }

      const grouped = {};
      [...records]
        .sort((a, b) =>
          b.date.localeCompare(a.date) || b.created - a.created
        )
        .forEach(record => {
          if (!grouped[record.date]) grouped[record.date] = [];
          grouped[record.date].push(record);
        });

      container.innerHTML = Object.keys(grouped).map(date => `
        <div class="date-heading">${formatDate(date)}</div>
        ${grouped[date].map(record => `
          <div class="entry">
            <div class="entry-title">
              <span>${escapeHtml(record.genset)}</span>
              <span>${money(record.cost)}</span>
            </div>

            <div class="entry-details">
              ${Number(record.hours).toFixed(1)} operating hours ·
              ${Number(record.litres).toFixed(2)} litres ·
              ${money(record.price)} per litre
              ${record.notes ? `<br>${escapeHtml(record.notes)}` : ""}
            </div>

            <div class="button-row">
              <button class="secondary" onclick="editRecord('${record.id}')">Edit</button>
              <button class="danger" onclick="deleteRecord('${record.id}')">Delete</button>
            </div>
          </div>
        `).join("")}
      `).join("");
    }

    function render() {
      renderSummary();
      renderRecords();
    }

    $("date").value = today();

    $("litres").addEventListener("input", updateCost);
    $("price").addEventListener("input", updateCost);

    $("logForm").addEventListener("submit", event => {
      event.preventDefault();

      const litres = Number($("litres").value);
      const price = Number($("price").value);
      const hours = Number($("hours").value);
      const existingId = $("entryId").value;

      const record = {
        id: existingId || crypto.randomUUID(),
        date: $("date").value,
        genset: $("genset").value,
        hours,
        litres,
        price,
        cost: litres * price,
        notes: $("notes").value.trim(),
        created: existingId
          ? (records.find(r => r.id === existingId)?.created || Date.now())
          : Date.now()
      };

      if (existingId) {
        records = records.map(r => r.id === existingId ? record : r);
      } else {
        records.push(record);
      }

      saveRecords();
      render();
      resetForm();
    });

    function resetForm() {
      $("logForm").reset();
      $("date").value = today();
      $("entryId").value = "";
      $("formTitle").textContent = "Add operating record";
      $("saveButton").textContent = "Save record";
      $("cancelButton").hidden = true;
      $("calculatedCost").textContent = money(0);
    }

    window.editRecord = function(id) {
      const record = records.find(r => r.id === id);
      if (!record) return;

      $("entryId").value = record.id;
      $("date").value = record.date;
      $("genset").value = record.genset;
      $("hours").value = record.hours;
      $("litres").value = record.litres;
      $("price").value = record.price;
      $("notes").value = record.notes || "";

      $("formTitle").textContent = "Edit operating record";
      $("saveButton").textContent = "Update record";
      $("cancelButton").hidden = false;
      updateCost();

      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    window.deleteRecord = function(id) {
      if (!confirm("Delete this operating record?")) return;

      records = records.filter(r => r.id !== id);
      saveRecords();
      render();
    };

    $("cancelButton").addEventListener("click", resetForm);

    $("exportButton").addEventListener("click", () => {
      if (!records.length) {
        alert("There are no records to export.");
        return;
      }

      const headings = [
        "Date",
        "Genset",
        "Operating hours",
        "Litres used",
        "Fuel price per litre",
        "Calculated fuel cost",
        "Notes"
      ];

      const rows = records.map(r => [
        r.date,
        r.genset,
        r.hours,
        r.litres,
        r.price,
        r.cost,
        r.notes || ""
      ]);

      const csv = [headings, ...rows]
        .map(row => row.map(value =>
          `"${String(value).replaceAll('"', '""')}"`
        ).join(","))
        .join("\n");

      const blob = new Blob(["\uFEFF" + csv], {
        type: "text/csv;charset=utf-8;"
      });

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "genset-records.csv";
      link.click();
      URL.revokeObjectURL(url);
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }

    render();
  </script>
</body>
</html>
